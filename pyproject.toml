[project]
name = "claimsense"
version = "0.1.0"
description = "Multimodal AI claims processing with a human in the loop (portfolio project)"
requires-python = ">=3.11"
readme = "README.md"
# Install only what the phase you're on needs, e.g.  pip install -e ".[api,dev]"
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pypdf>=4",
    "pillow>=10",
    "httpx>=0.27",
    "faker>=25",
    "reportlab>=4",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9", "sqlalchemy>=2.0",
       "langgraph>=0.6", "langgraph-checkpoint-sqlite>=2.0", "mcp>=1.9"]
llm = ["google-genai>=1.0"]
docs = ["opencv-python-headless>=4.9", "pytesseract>=0.3.10"]
speech = ["faster-whisper>=1.0"]
vision = ["ultralytics>=8.3", "onnxruntime>=1.18"]
rag = ["sentence-transformers>=3.0", "qdrant-client>=1.12"]
fraud = ["lightgbm>=4.3", "scikit-learn>=1.4"]
full = ["psycopg[binary]>=3.1", "langgraph-checkpoint-postgres>=2.0", "boto3>=1.34", "redis>=5",
        "confluent-kafka>=2.4", "langfuse>=3.0", "mlflow>=2.14"]
bigdata = ["pyspark>=3.5", "ray[data,tune]>=2.30", "opensearch-py>=2.6", "fairlearn>=0.11"]
train = ["torch", "transformers>=4.45", "peft>=0.12", "trl>=0.12", "bitsandbytes>=0.43",
         "accelerate>=0.33", "datasets>=2.20", "diffusers>=0.30", "wandb"]
demo = ["gradio>=4.40"]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["claimsense*", "evals*", "training*", "generators*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731"]
